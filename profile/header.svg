<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="vic10us: engineer, streamer, diy-er, maker">
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; }
    .dim { fill: #4a8a5d; }
    .fg { fill: #7dffa1; }
    .hi { fill: #d8ffe3; }
    .boot { opacity: 0; animation: in 0.01s forwards; }
    .b1 { animation-delay: 0.3s; } .b2 { animation-delay: 0.6s; } .b3 { animation-delay: 0.9s; }
    .title { opacity: 0; animation: in 0.4s 1.2s forwards; }
    .word { opacity: 0; animation: word 10s steps(1) infinite; }
    .w1 { animation-delay: 1.6s; } .w2 { animation-delay: 4.1s; } .w3 { animation-delay: 6.6s; } .w4 { animation-delay: 9.1s; }
    .cur { animation: blink 1.06s steps(1) infinite; }
    .tail { opacity: 0; animation: in 0.01s 2.2s forwards; }
    @keyframes in { to { opacity: 1; } }
    @keyframes word { 0% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .boot, .title, .tail { animation: none; opacity: 1; }
      .word { animation: none; } .w1 { opacity: 1; }
      .cur { animation: none; }
    }
  </style>
  <defs>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="40%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feFlood flood-color="#2bff6a" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="red" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#07090a" stroke="#1f4d2c"/>
  <path d="M0.5 34 H899.5" stroke="#1f4d2c"/>
  <circle cx="22" cy="17" r="5.5" fill="#ff5f57" opacity="0.85"/>
  <circle cx="40" cy="17" r="5.5" fill="#febc2e" opacity="0.85"/>
  <circle cx="58" cy="17" r="5.5" fill="#28c840" opacity="0.85"/>
  <text x="450" y="22" text-anchor="middle" font-size="12" class="dim">vic10us@lab-eridani: ~</text>

  <!-- boot log -->
  <text x="28" y="66" font-size="13" class="dim boot b1">[ OK ] mounted /dev/curiosity</text>
  <text x="28" y="86" font-size="13" class="dim boot b2">[ OK ] started coffee.service</text>
  <text x="28" y="106" font-size="13" class="dim boot b3">[ OK ] reached target garage.target</text>

  <!-- name -->
  <g class="title">
    <text x="26" y="172" font-size="64" font-weight="700" letter-spacing="2.5" class="hi" filter="url(#glow)">vic10us</text>
  </g>

  <!-- tagline: one word at a time, cursor follows the word -->
  <g font-size="20">
    <g class="word w1"><text x="28" y="210" class="fg">&gt; engineer</text><rect class="cur" x="150" y="194" width="11" height="20" fill="#7dffa1"/></g>
    <g class="word w2"><text x="28" y="210" class="fg">&gt; streamer</text><rect class="cur" x="150" y="194" width="11" height="20" fill="#7dffa1"/></g>
    <g class="word w3"><text x="28" y="210" class="fg">&gt; diy-er</text><rect class="cur" x="126" y="194" width="11" height="20" fill="#7dffa1"/></g>
    <g class="word w4"><text x="28" y="210" class="fg">&gt; maker</text><rect class="cur" x="114" y="194" width="11" height="20" fill="#7dffa1"/></g>
  </g>

  <!-- neofetch-ish -->
  <g class="tail" font-size="14">
    <text x="530" y="74"><tspan class="hi" font-weight="700">vic10us</tspan><tspan class="dim">@</tspan><tspan class="hi" font-weight="700">lab-eridani</tspan></text>
    <text x="530" y="92" class="dim">─────────────────────</text>
    <text x="530" y="116"><tspan class="dim">os</tspan><tspan x="600" class="fg">vic10us-os 4.2.0</tspan></text>
    <text x="530" y="138"><tspan class="dim">kernel</tspan><tspan x="600" class="fg">GNU/Garage</tspan></text>
    <text x="530" y="160"><tspan class="dim">builds</tspan><tspan x="600" class="fg">.NET · TS · Rust · C</tspan></text>
    <text x="530" y="182"><tspan class="dim">makes</tspan><tspan x="600" class="fg">3D prints · firmware</tspan></text>
    <text x="530" y="204"><tspan class="dim">shell</tspan><tspan x="600" class="fg">press ` on vic10.us</tspan></text>
  </g>

